<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🔐 Password Vault</h1>
    <form id="vault-form">
      <input type="text" id="website" placeholder="Website" required />
      <input type="text" id="username" placeholder="Username/Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <div class="actions">
        <button type="submit">Save</button>
        <button type="button" onclick="generatePassword()">Generate 🔄</button>
      </div>
    </form>

    <input type="text" id="search" placeholder="Search..." oninput="searchEntries()" />

    <div id="entries"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
